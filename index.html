<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Press</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #2a2340 0%, #14111f 70%);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .wrap {
      position: relative;
      width: 220px;
      height: 220px;
    }

    /* the base the button sits in */
    .wrap::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #0e0c16, #25203a);
      box-shadow:
        inset 0 6px 14px rgba(0, 0, 0, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.06);
    }

    button {
      position: absolute;
      inset: 0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      background: #b8123f; /* the "side" of the button */
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.5);
      transition: box-shadow 120ms ease;
    }

    button .top {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff7a9c 0%, #ff2e63 45%, #d61850 100%);
      transform: translateY(-16px);
      transition: transform 380ms cubic-bezier(0.3, 1.8, 0.4, 1);
      box-shadow:
        inset 0 -6px 12px rgba(0, 0, 0, 0.18),
        inset 0 6px 12px rgba(255, 255, 255, 0.35);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* glossy highlight */
    button .top::after {
      content: "";
      position: absolute;
      top: 12%;
      left: 22%;
      width: 42%;
      height: 24%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      filter: blur(6px);
      transform: rotate(-20deg);
    }

    button:hover .top { transform: translateY(-19px); }

    button.pressed .top {
      transform: translateY(-3px);
      transition: transform 60ms ease-out;
    }

    button.pressed { box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5); }

    button:focus-visible { box-shadow: 0 0 0 4px #fff, 0 18px 30px rgba(0,0,0,.5); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0);
      animation: ripple 600ms ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #ff7a9c;
      pointer-events: none;
      animation: ring 700ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes ring {
      from { transform: scale(1); opacity: 0.9; }
      to   { transform: scale(2.2); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      button .top, button.pressed .top { transition: none; }
      .ring, .ripple { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="wrap" id="wrap">
    <button id="btn" aria-label="A very satisfying button">
      <span class="top" id="top"></span>
    </button>
  </div>

  <script>
  (() => {
    const btn = document.getElementById("btn");
    const btnTop = document.getElementById("top");
    const wrap = document.getElementById("wrap");
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---------- sound ----------
    let audio;
    function getAudio() {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      return audio;
    }

    function clickDown() {
      const ac = getAudio();
      const t = ac.currentTime;
      // short thock
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.08);
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain).connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.13);

      // tiny noise tick
      const buf = ac.createBuffer(1, ac.sampleRate * 0.02, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const noise = ac.createBufferSource();
      const ng = ac.createGain();
      const hp = ac.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 2000;
      ng.gain.value = 0.25;
      noise.buffer = buf;
      noise.connect(hp).connect(ng).connect(ac.destination);
      noise.start(t);
    }

    let combo = 0;
    let comboTimer;
    function clickUp() {
      const ac = getAudio();
      const t = ac.currentTime;
      // pleasant pop that rises in pitch with rapid presses
      const pentatonic = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      const note = pentatonic[Math.min(combo, pentatonic.length - 1)];
      const freq = 523.25 * Math.pow(2, note / 12);
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain).connect(ac.destination);
      osc.start(t);
      osc.stop(t + 0.36);
    }

    // ---------- particles ----------
    let particles = [];
    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    const colors = ["#ff2e63", "#ff7a9c", "#ffd166", "#06d6a0", "#7aa2ff", "#ffffff"];

    function burst() {
      if (reduceMotion) return;
      const r = wrap.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2 - 10;
      const count = 28 + Math.min(combo, 10) * 4;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 4 + Math.random() * 7 + combo * 0.4;
        particles.push({
          x: cx + Math.cos(a) * 100,
          y: cy + Math.sin(a) * 100,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed - 2,
          size: 3 + Math.random() * 5,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          life: 1,
          decay: 0.012 + Math.random() * 0.015,
          color: colors[(Math.random() * colors.length) | 0],
          shape: Math.random() < 0.5 ? "circle" : "rect",
        });
      }
      if (!running) loop();
    }

    let running = false;
    function loop() {
      running = true;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter((p) => p.life > 0);
      for (const p of particles) {
        p.vx *= 0.96;
        p.vy = p.vy * 0.96 + 0.25;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= p.decay;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        if (p.shape === "circle") {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      if (particles.length) requestAnimationFrame(loop);
      else running = false;
    }

    // ---------- interaction ----------
    let isDown = false;

    function press(e) {
      if (isDown) return;
      isDown = true;
      btn.classList.add("pressed");
      clickDown();
      navigator.vibrate?.(12);

      // ripple from the pointer position
      const r = btnTop.getBoundingClientRect();
      const x = e.clientX ?? r.left + r.width / 2;
      const y = e.clientY ?? r.top + r.height / 2;
      const size = r.width / 2;
      const rip = document.createElement("span");
      rip.className = "ripple";
      rip.style.width = rip.style.height = size + "px";
      rip.style.left = x - r.left - size / 2 + "px";
      rip.style.top = y - r.top - size / 2 + "px";
      btnTop.appendChild(rip);
      rip.addEventListener("animationend", () => rip.remove());
    }

    function release() {
      if (!isDown) return;
      isDown = false;
      btn.classList.remove("pressed");
      clickUp();
      navigator.vibrate?.(6);
      burst();

      const ring = document.createElement("span");
      ring.className = "ring";
      wrap.appendChild(ring);
      ring.addEventListener("animationend", () => ring.remove());

      combo++;
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => (combo = 0), 700);
    }

    btn.addEventListener("pointerdown", (e) => {
      btn.setPointerCapture(e.pointerId);
      press(e);
    });
    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);

    // keyboard support
    btn.addEventListener("keydown", (e) => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) {
        e.preventDefault();
        press({});
      }
    });
    btn.addEventListener("keyup", (e) => {
      if (e.key === " " || e.key === "Enter") release();
    });
  })();
  </script>
</body>
</html>
